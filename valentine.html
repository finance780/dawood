<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Valentine Page</title>
  <style>
    body {
      background: pink;
      font-family: sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }
    h1 {
      font-size: 36px;
      color: red;
    }
    .heart {
      font-size: 50px;
      animation: float 3s infinite;
    }
    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-20px); }
      100% { transform: translateY(0px); }
    }
    button {
      padding: 10px 20px;
      font-size: 20px;
      margin: 10px;
      cursor: pointer;
      border-radius: 10px;
      border: none;
      background: red;
      color: white;
    }
  </style>
</head>
<body>
  <div>
    <h1>Will you be my Valentine? 💖</h1>
    <div class="heart">💘💗💝</div>
    <br>
    <button id="yesBtn">Yes 💖</button>
    <button id="noBtn">No 😼</button>
  </div>

  <!-- Audio -->
  <audio id="bgMusic" autoplay loop>
    <source src="music.mp3" type="audio/mpeg">
    Your browser does not support the audio element.
  </audio>

  <script>
    const yesBtn = document.getElementById('yesBtn');
    const noBtn = document.getElementById('noBtn');

    yesBtn.addEventListener('click', () => {
      document.body.innerHTML = `
        <h1>I Knew it! 💘</h1>
        <img src="https://media1.giphy.com/media/v1.Y2lkPTc5MGI3NjExeTZwdDB4c3BidTNmeWdoOHhtOG5renFpcm1zbnVmcXJvNmwxZ2JuYiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/vbqr9NgKRuKq7meXsi/giphy.gif" alt="Flying kiss">
        <p>Congratulations! You are now officially Dawood Valentine 💘<br>
        Forever and always! 💘<br>
        (I mean, we both knew you'd say yes eventually 😍)</p>
      `;
    });

    noBtn.addEventListener('click', () => {
      // Move the no button randomly
      const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
      const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
      noBtn.style.position = 'absolute';
      noBtn.style.left = x + 'px';
      noBtn.style.top = y + 'px';
    });
  </script>
</body>
</html>
